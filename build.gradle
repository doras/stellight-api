plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.doras.web'
version = '1.0-SNAPSHOT-'+new Date().format("yyyyMMddHHmmss")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def querydslVersion = '7.7' // OpenFeign fork; not managed by Spring Boot

dependencies {
    // starters
    implementation('org.springframework.boot:spring-boot-starter-webmvc')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation('org.springframework.boot:spring-boot-starter-security-oauth2-client')

    // test starters (each brings in spring-boot-starter-test)
    testImplementation('org.springframework.boot:spring-boot-starter-webmvc-test')
    testImplementation('org.springframework.boot:spring-boot-starter-data-jpa-test')
    testImplementation('org.springframework.boot:spring-boot-starter-security-test')
    testRuntimeOnly('org.springframework.boot:spring-boot-restclient')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')

    // lombok
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')

    // H2 only for tests and local bootRun; excluded from the bootJar deployed to production (MariaDB),
    // so a production run without the real DB configuration fails fast instead of starting on H2
    testAndDevelopmentOnly('com.h2database:h2')
    developmentOnly('org.springframework.boot:spring-boot-h2console')

    // querydsl dependencies (Q-classes are generated by the annotation processor)
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // MariaDB
    implementation("org.mariadb.jdbc:mariadb-java-client")
}

test {
    useJUnitPlatform()
}

tasks.named("jar") {
    enabled = false
}

// Load real OAuth2 credentials (application-oauth.properties) from outside the repository for local runs.
// Passed as a system property so that it is kept even when `--args` is given.
def localConfigDir = "${System.getProperty('user.home').replace('\\', '/')}/.stellight"
bootRun {
    systemProperty 'spring.config.additional-location', "file:${localConfigDir}/"
    doFirst {
        if (!file("${localConfigDir}/application-oauth.properties").exists()) {
            throw new GradleException(
                    "OAuth2 credentials not found: ${localConfigDir}/application-oauth.properties\n" +
                    "Create it with the Naver OAuth2 client registration before running bootRun.")
        }
    }
}
