plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.8'
    id 'io.spring.dependency-management' version '1.1.0'
    id "com.ewerk.gradle.plugins.querydsl" version "1.0.10"
}

group = 'com.doras.web'
version = '1.0-SNAPSHOT-'+new Date().format("yyyyMMddHHmmss")
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // default starters
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    implementation('org.springframework.boot:spring-boot-starter-oauth2-client')

    // security
    testImplementation("org.springframework.security:spring-security-test")

    // lombok
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')

    // h2
    implementation('com.h2database:h2')

    // jackson
    implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310')

    // querydsl dependencies
    implementation "com.querydsl:querydsl-jpa"
    implementation "com.querydsl:querydsl-apt"

    // MariaDB
    implementation("org.mariadb.jdbc:mariadb-java-client")
}

test {
    useJUnitPlatform()
}

def querydslDir = "$buildDir/generated/querydsl"

querydsl {
    library = "com.querydsl:querydsl-apt"
    jpa = true
    querydslSourcesDir = querydslDir
}
sourceSets {
    main.java.srcDir querydslDir
}
compileQuerydsl{
    options.annotationProcessorPath = configurations.querydsl
}
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    querydsl.extendsFrom compileClasspath
}

tasks.named("jar") {
    enabled = false
}

// Load real OAuth2 credentials (application-oauth.properties) from outside the repository for local runs.
// Passed as a system property so that it is kept even when `--args` is given.
def localConfigDir = "${System.getProperty('user.home').replace('\\', '/')}/.stellight"
bootRun {
    systemProperty 'spring.config.additional-location', "file:${localConfigDir}/"
    doFirst {
        if (!file("${localConfigDir}/application-oauth.properties").exists()) {
            throw new GradleException(
                    "OAuth2 credentials not found: ${localConfigDir}/application-oauth.properties\n" +
                    "Create it with the Naver OAuth2 client registration before running bootRun.")
        }
    }
}
