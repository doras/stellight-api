plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.doras.web'
version = '1.0-SNAPSHOT-'+new Date().format("yyyyMMddHHmmss")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // default starters
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    implementation('org.springframework.boot:spring-boot-starter-oauth2-client')

    // security
    testImplementation("org.springframework.security:spring-security-test")

    // lombok
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')

    // h2
    runtimeOnly('com.h2database:h2')

    // jackson
    implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310')

    // querydsl dependencies (Q-classes are generated by the annotation processor)
    implementation "com.querydsl:querydsl-jpa::jakarta"
    annotationProcessor "com.querydsl:querydsl-apt::jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // MariaDB
    implementation("org.mariadb.jdbc:mariadb-java-client")
}

test {
    useJUnitPlatform()
}

tasks.named("jar") {
    enabled = false
}

// Load real OAuth2 credentials (application-oauth.properties) from outside the repository for local runs.
// Passed as a system property so that it is kept even when `--args` is given.
def localConfigDir = "${System.getProperty('user.home').replace('\\', '/')}/.stellight"
bootRun {
    systemProperty 'spring.config.additional-location', "file:${localConfigDir}/"
    doFirst {
        if (!file("${localConfigDir}/application-oauth.properties").exists()) {
            throw new GradleException(
                    "OAuth2 credentials not found: ${localConfigDir}/application-oauth.properties\n" +
                    "Create it with the Naver OAuth2 client registration before running bootRun.")
        }
    }
}
